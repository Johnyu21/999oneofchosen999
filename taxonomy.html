<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#edf3f6">
  <title>II · 谱系 — 999one of chosen999</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./sanctuary.css?v=6">
  <style>
    .pillar-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .pillar-card {
      text-align: left;
      width: 100%;
    }

    .pillar-card.is-selected {
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 10px 26px rgba(65, 111, 137, 0.14);
    }

    .pillar-num {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      color: var(--gold-accent);
      margin-bottom: 6px;
    }

    .pillar-card h3 {
      margin: 0 0 4px;
      font-size: 15.5px;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--ink);
    }

    .pillar-card p {
      margin: 0;
      font-size: 12.5px;
      color: var(--ink-soft);
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 26px;
    }

    .tag-btn {
      padding: 6px 12px;
      border: 1px solid rgba(65, 111, 137, 0.26);
      background: rgba(246, 250, 253, 0.84);
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .tag-btn:hover,
    .tag-btn.is-active {
      color: var(--core-blue);
      border-color: var(--core-blue);
      background: #ffffff;
    }

    .index-entries {
      display: grid;
      gap: 12px;
    }

    .entry-row {
      display: grid;
      grid-template-columns: 104px 1fr auto;
      gap: 16px;
      align-items: center;
      text-decoration: none;
      color: var(--ink);
    }

    .entry-row.is-hidden {
      display: none;
    }

    .entry-cat {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--gold-accent);
    }

    .entry-title {
      font-size: 14.5px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .entry-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    @media (max-width: 780px) {
      .pillar-grid { grid-template-columns: 1fr; }
      .entry-row { grid-template-columns: 1fr; gap: 6px; }
      .entry-tags { justify-content: flex-start; }
    }
  </style>
</head>
<body class="layout-right-offset theme-style-2">
  <div class="sanctuary-bg" aria-hidden="true">
    <img src="./angel-left.jpg" alt="">
  </div>
  <canvas class="particle-canvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="topbar-brand" href="./index.html">
      <span class="topbar-back">← SANCTUARY</span>
      <span class="topbar-name"><span class="num">999</span>one of chosen<span class="num">999</span></span>
    </a>
    <nav class="topbar-nav" aria-label="板块导航">
      <a href="./codex.html"><span class="roman">I.</span>启示录</a>
      <a class="is-active" href="./taxonomy.html"><span class="roman">II.</span>谱系</a>
      <a href="./relics.html"><span class="roman">III.</span>造物志</a>
      <a href="./oracle.html"><span class="roman">IV.</span>铭文</a>
    </nav>
  </header>

  <main class="page-wrap">
    <section class="page-header">
      <div class="page-eyebrow">SEAL II // COSMOS · 宇宙</div>
      <h1 class="page-title">谱系<span class="en">Tabula Cosmica</span></h1>
      <p class="page-lead">「凡被命名的星辰，皆不再迷失于混沌。」</p>
    </section>

    <blockquote class="epigraph">
      <p class="epigraph-latin">“Quod est inferius est sicut quod est superius.”</p>
      <p class="epigraph-zh">「穹苍之律映于微尘，幽冥之典藏于星轨。」</p>
    </blockquote>

    <section class="pillar-grid" id="pillar-grid">
      <button class="glass-panel pillar-card interactive-card is-selected" data-cat="all" type="button">
        <div class="pillar-num"><span>OMNIA</span><span data-count="all">00</span></div>
        <h3>全部卷宗</h3>
        <p>一览「造物志」项目与「铭文」全部文章。</p>
      </button>
      <button class="glass-panel pillar-card interactive-card" data-cat="project" type="button">
        <div class="pillar-num"><span>SPHERE I</span><span data-count="project">00</span></div>
        <h3>项目 · Projects</h3>
        <p>归档开源项目与在线 Demo 作品。</p>
      </button>
      <button class="glass-panel pillar-card interactive-card" data-cat="reflection" type="button">
        <div class="pillar-num"><span>SPHERE II</span><span data-count="reflection">00</span></div>
        <h3>感悟 · Reflections</h3>
        <p>思考碎片、审美判断与灵感短札。</p>
      </button>
      <button class="glass-panel pillar-card interactive-card" data-cat="craft" type="button">
        <div class="pillar-num"><span>SPHERE III</span><span data-count="craft">00</span></div>
        <h3>技巧 · Craft</h3>
        <p>AI 提示词心法、终端命令与效率利技。</p>
      </button>
      <button class="glass-panel pillar-card interactive-card" data-cat="experience" type="button">
        <div class="pillar-num"><span>SPHERE IV</span><span data-count="experience">00</span></div>
        <h3>经验 · Experience</h3>
        <p>后端架构、自动化脚本与真实踩坑复盘。</p>
      </button>
    </section>

    <div class="tag-cloud" id="tag-cloud" role="group" aria-label="星标筛选"></div>
    <section class="index-entries" id="entry-list"></section>

    <footer class="page-footer">
      <span>SEAL II // QUOD EST INFERIUS</span>
      <span><a href="./codex.html">← 第一印：I. 启示录</a> · <a href="./relics.html">第三印：III. 造物志 →</a></span>
    </footer>
  </main>

  <script src="./sanctuary.js?v=6"></script>
  <script>
    (async function () {
      const catNames = { project: "项目", reflection: "感悟", craft: "技巧", experience: "经验" };
      const tagCloud = document.getElementById("tag-cloud");
      const entryList = document.getElementById("entry-list");
      const pillars = document.querySelectorAll(".pillar-card");

      let currentCat = "all";
      let currentTag = "all";
      let items = [];

      function esc(str) {
        return String(str || "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[m]));
      }

      try {
        const res = await fetch("./content.json?t=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        const projects = (data.projects || []).map((p) => ({
          cat: "project",
          catLabel: p.kind === "demo" ? "项目 // DEMO" : "项目 // 开源",
          title: p.title,
          tags: p.tags || [],
          href: "./relics.html"
        }));
        const articles = (data.articles || []).map((a) => ({
          cat: a.topic || "reflection",
          catLabel: `${catNames[a.topic] || "铭文"} // 卷`,
          title: a.title,
          tags: a.tags || [],
          href: `./oracle.html#${encodeURIComponent(a.id || "")}`
        }));
        items = [...projects, ...articles];
      } catch (err) {
        entryList.innerHTML = '<div class="glass-panel">暂未加载到卷宗数据（请通过 HTTP/GitHub Pages 访问）。</div>';
        return;
      }

      // Update counts
      const counts = { all: items.length, project: 0, reflection: 0, craft: 0, experience: 0 };
      items.forEach((it) => { if (counts[it.cat] !== undefined) counts[it.cat]++; });
      Object.keys(counts).forEach((k) => {
        const el = document.querySelector(`[data-count="${k}"]`);
        if (el) el.textContent = String(counts[k]).padStart(2, "0");
      });

      // Build dynamic tag cloud
      const allTags = Array.from(new Set(items.flatMap((it) => it.tags)));
      tagCloud.innerHTML = `<button class="tag-btn is-active" data-tag="all" type="button">✦ ALL</button>` +
        allTags.map((t) => `<button class="tag-btn" data-tag="${esc(t)}" type="button">#${esc(t)}</button>`).join("");

      // Render entries
      entryList.innerHTML = items.map((it) => `
        <a class="glass-panel entry-row" href="${esc(it.href)}" data-cat="${esc(it.cat)}" data-tags="${esc(it.tags.join("|"))}">
          <span class="entry-cat">${esc(it.catLabel)}</span>
          <span class="entry-title">${esc(it.title)}</span>
          <span class="entry-tags">${it.tags.map((t) => `<span class="tag-chip">#${esc(t)}</span>`).join("")}</span>
        </a>
      `).join("");

      const rows = entryList.querySelectorAll(".entry-row");
      const tagBtns = tagCloud.querySelectorAll(".tag-btn");

      function applyFilter() {
        rows.forEach((row) => {
          const catMatch = currentCat === "all" || row.dataset.cat === currentCat;
          const tags = (row.dataset.tags || "").split("|").filter(Boolean);
          const tagMatch = currentTag === "all" || tags.includes(currentTag);
          row.classList.toggle("is-hidden", !(catMatch && tagMatch));
        });
      }

      pillars.forEach((btn) => {
        btn.addEventListener("click", () => {
          currentCat = btn.dataset.cat;
          pillars.forEach((p) => p.classList.toggle("is-selected", p === btn));
          applyFilter();
        });
      });

      tagBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          currentTag = btn.dataset.tag;
          tagBtns.forEach((t) => t.classList.toggle("is-active", t === btn));
          applyFilter();
        });
      });
    })();
  </script>
</body>
</html>
