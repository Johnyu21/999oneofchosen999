<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#edf3f6">
  <title>III · 造物志 — 999one of chosen999</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./sanctuary.css?v=6">
  <style>
    .relic-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .relic-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
    }

    .relic-card.is-hidden {
      display: none;
    }

    .relic-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      margin-bottom: 12px;
    }

    .relic-type { color: var(--gold-accent); }

    .relic-status {
      padding: 2px 8px;
      border: 1px solid rgba(65, 111, 137, 0.34);
      color: var(--core-blue);
      font-size: 9.5px;
    }

    .relic-card h3 {
      margin: 0 0 8px;
      font-size: 17.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
    }

    .relic-card p {
      margin: 0 0 18px;
      font-size: 13.5px;
      color: var(--ink-soft);
      line-height: 1.8;
    }

    .relic-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 12px;
      border-top: 1px solid rgba(53, 79, 94, 0.14);
    }

    .relic-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .relic-link {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--core-blue);
      text-decoration: none;
      white-space: nowrap;
    }

    .relic-link:hover { text-decoration: underline; }

    @media (max-width: 780px) {
      .relic-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="theme-style-3">
  <div class="sanctuary-bg" aria-hidden="true">
    <img src="./angel-back.jpg" alt="">
  </div>
  <canvas class="particle-canvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="topbar-brand" href="./index.html">
      <span class="topbar-back">← SANCTUARY</span>
      <span class="topbar-name"><span class="num">999</span>one of chosen<span class="num">999</span></span>
    </a>
    <nav class="topbar-nav" aria-label="板块导航">
      <a href="./codex.html"><span class="roman">I.</span>启示录</a>
      <a href="./taxonomy.html"><span class="roman">II.</span>谱系</a>
      <a class="is-active" href="./relics.html"><span class="roman">III.</span>造物志</a>
      <a href="./oracle.html"><span class="roman">IV.</span>铭文</a>
    </nav>
  </header>

  <main class="page-wrap">
    <section class="page-header">
      <div class="page-eyebrow">SEAL III // IGNIS · 火源</div>
      <h1 class="page-title">造物志<span class="en">Reliquiae Ignis</span></h1>
      <p class="page-lead">「既已将天火掷入凡间，便只愿它在静默中长燃。」</p>
    </section>

    <blockquote class="epigraph">
      <p class="epigraph-latin">“Ignis caelestis ex incude Svarogii descendit.”</p>
      <p class="epigraph-zh">「凡器物之初，皆曾受天火淬炼；余烬未冷，造物不止。」</p>
    </blockquote>

    <div class="filter-bar" role="group" aria-label="项目类型筛选">
      <button class="filter-btn is-active" data-filter="all" type="button">✦ ALL · 全部项目</button>
      <button class="filter-btn" data-filter="opensource" type="button">OPEN SOURCE · 开源项目</button>
      <button class="filter-btn" data-filter="demo" type="button">DEMO · Demo 项目</button>
    </div>

    <section class="relic-grid" id="relic-grid"></section>

    <footer class="page-footer">
      <span>SEAL III // IGNIS CAELESTIS</span>
      <span><a href="./taxonomy.html">← 第二印：II. 谱系</a> · <a href="./oracle.html">第四印：IV. 铭文 →</a></span>
    </footer>
  </main>

  <script src="./sanctuary.js?v=6"></script>
  <script>
    (async function () {
      const grid = document.getElementById("relic-grid");
      const btns = document.querySelectorAll(".filter-btn");
      const romans = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];

      function esc(str) {
        return String(str || "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[m]));
      }

      try {
        const res = await fetch("./content.json?t=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        const projects = data.projects || [];

        grid.innerHTML = projects.map((p, idx) => {
          const isExternal = /^https?:\/\//i.test(p.url || "");
          const typeLabel = p.kind === "demo" ? "DEMO" : "OPEN SOURCE";
          return `
            <article class="glass-panel relic-card" data-kind="${esc(p.kind || "opensource")}">
              <div>
                <div class="relic-meta">
                  <span class="relic-type">RELIC ${romans[idx] || (idx + 1)} // ${typeLabel}</span>
                  <span class="relic-status">${esc(p.status || "LIVE")}</span>
                </div>
                <h3>${esc(p.title)}</h3>
                <p>${esc(p.desc)}</p>
              </div>
              <div class="relic-foot">
                <div class="relic-tags">${(p.tags || []).map((t) => `<span class="tag-chip">${esc(t)}</span>`).join("")}</div>
                <a class="relic-link" href="${esc(p.url || "#")}" ${isExternal ? 'target="_blank" rel="noopener"' : ""}>${esc(p.linkLabel || "OPEN ↗")}</a>
              </div>
            </article>
          `;
        }).join("");

        const cards = grid.querySelectorAll(".relic-card");
        btns.forEach((btn) => {
          btn.addEventListener("click", () => {
            const f = btn.dataset.filter;
            btns.forEach((b) => b.classList.toggle("is-active", b === btn));
            cards.forEach((c) => c.classList.toggle("is-hidden", f !== "all" && c.dataset.kind !== f));
          });
        });
      } catch (err) {
        grid.innerHTML = '<div class="glass-panel">暂未加载到项目数据（请通过 HTTP/GitHub Pages 访问）。</div>';
      }
    })();
  </script>
</body>
</html>
