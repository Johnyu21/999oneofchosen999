<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#edf3f6">
  <title>IV · 铭文 — 999one of chosen999</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+SC:wght@400;500;600&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./sanctuary.css?v=6">
  <style>
    .dispatch-list {
      display: grid;
      gap: 16px;
    }

    .dispatch-card { cursor: pointer; }
    .dispatch-card.is-hidden { display: none; }

    .dispatch-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.18em;
      color: var(--ink-faint);
    }

    .dispatch-num { color: var(--gold-accent); }

    .dispatch-card h3 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--ink);
    }

    .dispatch-card p {
      margin: 0 0 14px;
      font-size: 13.5px;
      color: var(--ink-soft);
      line-height: 1.8;
    }

    .dispatch-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .read-hint {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.16em;
      color: var(--core-blue);
    }

    .reader-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(21, 35, 45, 0.45);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .reader-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .reader-sheet {
      width: min(760px, 100%);
      max-height: 86vh;
      overflow-y: auto;
      padding: 30px 34px;
      background: rgba(248, 252, 254, 0.97);
      box-shadow: 0 24px 60px rgba(21, 35, 45, 0.18);
      transform: translateY(10px);
      transition: transform 0.25s ease, width 0.28s cubic-bezier(0.22, 1, 0.36, 1), max-height 0.28s ease;
    }

    .reader-sheet.is-expanded {
      width: min(1180px, 95vw);
      max-height: 92vh;
      padding: 36px clamp(28px, 5vw, 68px);
    }

    .reader-overlay.is-open .reader-sheet { transform: translateY(0); }

    .reader-head {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 16px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .reader-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
    }

    .reader-tools {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      margin-left: auto;
    }

    .reader-tool-btn,
    .reader-close {
      padding: 5px 11px;
      border: 1px solid var(--line-strong);
      background: #ffffff;
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.12em;
      color: var(--ink);
      transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    }

    .reader-tool-btn:hover,
    .reader-tool-btn.is-active,
    .reader-close:hover {
      border-color: var(--core-blue);
      color: var(--core-blue);
      background: #f4fafd;
    }

    .reader-body {
      --reader-size: 15px;
      font-size: var(--reader-size);
    }

    .reader-body h4 {
      margin: 22px 0 10px;
      font-size: calc(var(--reader-size) * 1.12);
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.06em;
    }

    .reader-body p {
      margin: 0 0 14px;
      font-size: var(--reader-size);
      color: var(--ink-soft);
      line-height: 1.95;
    }

    .reader-body pre {
      margin: 14px 0 18px;
      padding: 14px 16px;
      background: rgba(21, 35, 45, 0.92);
      color: #dff1fa;
      font-family: var(--font-mono);
      font-size: calc(var(--reader-size) * 0.86);
      line-height: 1.65;
      overflow-x: auto;
    }

    .reader-comments {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px dashed rgba(53, 79, 94, 0.24);
    }

    .reader-comments-title {
      margin: 0 0 14px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.2em;
      color: var(--gold-accent);
      text-transform: uppercase;
    }
  </style>
</head>
<body class="layout-left-offset theme-style-2">
  <div class="sanctuary-bg" aria-hidden="true">
    <img src="./angel-right.jpg" alt="">
  </div>
  <canvas class="particle-canvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="topbar-brand" href="./index.html">
      <span class="topbar-back">← SANCTUARY</span>
      <span class="topbar-name"><span class="num">999</span>one of chosen<span class="num">999</span></span>
    </a>
    <nav class="topbar-nav" aria-label="板块导航">
      <a href="./codex.html"><span class="roman">I.</span>启示录</a>
      <a href="./taxonomy.html"><span class="roman">II.</span>谱系</a>
      <a href="./relics.html"><span class="roman">III.</span>造物志</a>
      <a class="is-active" href="./oracle.html"><span class="roman">IV.</span>铭文</a>
    </nav>
  </header>

  <main class="page-wrap">
    <section class="page-header">
      <div class="page-eyebrow">SEAL IV // LOGOS · 汲取</div>
      <h1 class="page-title">铭文<span class="en">Scripturae Technicae</span></h1>
      <p class="page-lead">「真理从不喧哗，凡心有静气者，自可听见余音。」</p>
    </section>

    <blockquote class="epigraph">
      <p class="epigraph-latin">“Nihil sub sole novum.”</p>
      <p class="epigraph-zh">「日光之下并无新事；渡海者不语风浪，唯于沉默中刻下航标。」</p>
    </blockquote>

    <div class="filter-bar" id="filter-bar" role="group" aria-label="文章分类筛选"></div>

    <section class="dispatch-list" id="dispatch-list"></section>

    <footer class="page-footer">
      <span>SEAL IV // NIHIL SUB SOLE NOVUM</span>
      <span><a href="./relics.html">← 第三印：III. 造物志</a> · <a href="./index.html">返回圣殿 ↗</a></span>
    </footer>
  </main>

  <div class="reader-overlay" id="reader-overlay" aria-hidden="true">
    <div class="reader-sheet" id="reader-sheet" role="dialog" aria-modal="true" aria-labelledby="reader-title">
      <div class="reader-head">
        <div class="reader-top-row">
          <div class="page-eyebrow" id="reader-meta" style="margin-bottom: 0;"></div>
          <div class="reader-tools">
            <button class="reader-tool-btn" id="reader-font-dec" type="button" title="缩小字号">A-</button>
            <button class="reader-tool-btn" id="reader-font-inc" type="button" title="放大字号">A+</button>
            <button class="reader-tool-btn" id="reader-expand" type="button" title="放大/还原阅读窗">EXPAND ⤢</button>
            <button class="reader-close" id="reader-close" type="button">SEAL [ESC]</button>
          </div>
        </div>
        <h2 id="reader-title" style="margin: 0; font-size: 22px; font-weight: 500; letter-spacing: 0.06em;"></h2>
      </div>
      <div class="reader-body" id="reader-body"></div>
      <section class="reader-comments" aria-label="访客点赞与评论">
        <div class="reader-comments-title">✦ RESONANCE · 点赞与留声</div>
        <div id="giscus-mount"></div>
      </section>
    </div>
  </div>

  <script src="./sanctuary.js?v=6"></script>
  <script>
    (async function () {
      const listEl = document.getElementById("dispatch-list");
      const filterBar = document.getElementById("filter-bar");
      const overlay = document.getElementById("reader-overlay");
      const sheetEl = document.getElementById("reader-sheet");
      const metaEl = document.getElementById("reader-meta");
      const titleEl = document.getElementById("reader-title");
      const bodyEl = document.getElementById("reader-body");
      const closeBtn = document.getElementById("reader-close");
      const expandBtn = document.getElementById("reader-expand");
      const fontDecBtn = document.getElementById("reader-font-dec");
      const fontIncBtn = document.getElementById("reader-font-inc");

      let readerSize = 15;
      function applyReaderSize() {
        bodyEl.style.setProperty("--reader-size", `${readerSize}px`);
      }
      fontDecBtn.addEventListener("click", () => {
        readerSize = Math.max(13, readerSize - 1.5);
        applyReaderSize();
      });
      fontIncBtn.addEventListener("click", () => {
        readerSize = Math.min(22, readerSize + 1.5);
        applyReaderSize();
      });
      expandBtn.addEventListener("click", () => {
        const expanded = sheetEl.classList.toggle("is-expanded");
        expandBtn.classList.toggle("is-active", expanded);
        expandBtn.textContent = expanded ? "RESTORE ⤡" : "EXPAND ⤢";
      });

      const legacyTopic = { reflection: "感悟", craft: "技巧", experience: "经验" };
      const romans = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];

      function esc(str) {
        return String(str || "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[m]));
      }

      function getTopic(a) {
        const raw = String(a.topic || "").trim();
        return legacyTopic[raw] || raw || "未分类";
      }

      function formatBody(raw) {
        const text = String(raw || "");
        const parts = text.split(/```([\s\S]*?)```/g);
        return parts.map((chunk, i) => {
          if (i % 2 === 1) {
            return `<pre><code>${esc(chunk.replace(/^\n+|\n+$/g, ""))}</code></pre>`;
          }
          return chunk.split(/\n\s*\n/).map((block) => {
            const lines = block.trim().split("\n").map((l) => l.trim()).filter(Boolean);
            if (!lines.length) return "";
            let html = "";
            let paraLines = [];
            const flushPara = () => {
              if (paraLines.length) {
                html += `<p>${paraLines.map(esc).join("<br>")}</p>`;
                paraLines = [];
              }
            };
            lines.forEach((line) => {
              if (line.startsWith("## ")) {
                flushPara();
                html += `<h4>${esc(line.slice(3))}</h4>`;
              } else {
                paraLines.push(line);
              }
            });
            flushPara();
            return html;
          }).join("");
        }).join("");
      }

      let articles = [];
      try {
        const res = await fetch("./content.json?t=" + Date.now(), { cache: "no-store" });
        const data = await res.json();
        articles = data.articles || [];
      } catch (err) {
        listEl.innerHTML = '<div class="glass-panel">暂未加载到文章数据（请通过 HTTP/GitHub Pages 访问）。</div>';
        return;
      }

      const topics = Array.from(new Set(articles.map(getTopic)));
      filterBar.innerHTML = `<button class="filter-btn is-active" data-topic="all" type="button">✦ ALL · 全部文章</button>` +
        topics.map((t) => `<button class="filter-btn" data-topic="${esc(t)}" type="button">${esc(t)}</button>`).join("");

      listEl.innerHTML = articles.map((a, idx) => {
        const label = getTopic(a);
        return `
          <article class="glass-panel dispatch-card interactive-card" data-topic="${esc(label)}" data-idx="${idx}">
            <div class="dispatch-top">
              <span class="dispatch-num">TABLET ${romans[idx] || (idx + 1)} // ${esc(label)}</span>
              <span>${esc(a.date || "")}</span>
            </div>
            <h3>${esc(a.title)}</h3>
            <p>${esc(a.summary)}</p>
            <div class="dispatch-foot">
              <div>${(a.tags || []).map((t) => `<span class="tag-chip">#${esc(t)}</span>`).join(" ")}</div>
              <span class="read-hint">UNSEAL SCROLL ↗</span>
            </div>
          </article>
        `;
      }).join("");

      const giscusMount = document.getElementById("giscus-mount");

      function loadGiscusForArticle(article) {
        giscusMount.innerHTML = "";
        const s = document.createElement("script");
        s.src = "https://giscus.app/client.js";
        s.setAttribute("data-repo", "Johnyu21/999oneofchosen999");
        s.setAttribute("data-repo-id", "R_kgDOV5mzNw");
        s.setAttribute("data-category", "General");
        s.setAttribute("data-category-id", "DIC_kwDOV5mzN84DMEbg");
        s.setAttribute("data-mapping", "specific");
        s.setAttribute("data-term", `oracle:${article.id || article.title}`);
        s.setAttribute("data-strict", "0");
        s.setAttribute("data-reactions-enabled", "1");
        s.setAttribute("data-emit-metadata", "0");
        s.setAttribute("data-input-position", "top");
        s.setAttribute("data-theme", "noborder_light");
        s.setAttribute("data-lang", "zh-CN");
        s.setAttribute("crossorigin", "anonymous");
        s.async = true;
        giscusMount.appendChild(s);
      }

      function openArticle(idx) {
        const a = articles[idx];
        if (!a) return;
        const label = getTopic(a);
        metaEl.textContent = `TABLET ${romans[idx] || (idx + 1)} // ${label} · ${a.date || ""}`;
        titleEl.textContent = a.title;
        bodyEl.innerHTML = formatBody(a.body);
        sheetEl.scrollTop = 0;
        overlay.classList.add("is-open");
        overlay.setAttribute("aria-hidden", "false");
        loadGiscusForArticle(a);
      }

      function closeArticle() {
        overlay.classList.remove("is-open");
        overlay.setAttribute("aria-hidden", "true");
        if (window.location.hash) history.replaceState(null, "", window.location.pathname);
      }

      const btns = filterBar.querySelectorAll(".filter-btn");
      const cards = listEl.querySelectorAll(".dispatch-card");
      cards.forEach((card) => {
        card.addEventListener("click", () => openArticle(Number(card.dataset.idx)));
      });

      btns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const t = btn.dataset.topic;
          btns.forEach((b) => b.classList.toggle("is-active", b === btn));
          cards.forEach((c) => c.classList.toggle("is-hidden", t !== "all" && c.dataset.topic !== t));
        });
      });

      closeBtn.addEventListener("click", closeArticle);
      overlay.addEventListener("click", (e) => { if (e.target === overlay) closeArticle(); });
      window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeArticle(); });

      // Deep-link support from taxonomy.html (#article-id)
      if (window.location.hash) {
        const targetId = decodeURIComponent(window.location.hash.slice(1));
        const matchIdx = articles.findIndex((a) => a.id === targetId);
        if (matchIdx >= 0) openArticle(matchIdx);
      }
    })();
  </script>
</body>
</html>
